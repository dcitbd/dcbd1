<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Reseller Login | Dream Cart BD</title>
  <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7IMYDMkNYleCqUCLvSDtcioP1MAENEONLcelVu_7byA&s=10">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 32px; max-width: 400px; width: 90%; box-shadow: var(--card-shadow);">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 20px; font-weight: 800; color: #10b981;">রিসেলার লগইন</h2>
      <p style="font-size: 12px; color: var(--text-muted);">রিসেলার ড্যাশবোর্ড ও কমিশন হিসেব এক্সেস করুন</p>
    </div>

    <form id="reseller-login-form">
      <div style="margin-bottom: 16px;">
        <label style="font-size: 12px; font-weight: 700; margin-bottom: 6px; display: block;">রিসেলার ইউজার আইডি / মোবাইল</label>
        <input type="text" name="username" required value="res_sagor" placeholder="res_sagor" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <div style="margin-bottom: 20px;">
        <label style="font-size: 12px; font-weight: 700; margin-bottom: 6px; display: block;">পাসওয়ার্ড</label>
        <input type="password" name="password" required value="Jainal@2001" placeholder="******" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <button type="submit" class="btn-order-now" style="width: 100%; padding: 12px; font-size: 14px; background: #10b981;">রিসেলার লগইন</button>
    </form>

    <div style="text-align: center; margin-top: 16px; font-size: 13px;">
      নতুন রিসেলার? <a href="register.html" style="color: #10b981; font-weight: 700;">রেজিস্ট্রেশন করুন</a>
    </div>
    <div style="text-align: center; margin-top: 12px; font-size: 12px;">
      <a href="../index.html" style="color: var(--text-muted);">← মূল ওয়েবসাইটে ফিরে যান</a>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/reseller.js"></script>
</body>
</html>
