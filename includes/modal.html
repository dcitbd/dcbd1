<!-- Universal Modal Component -->
<div id="universal-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center;">
  <div style="background: var(--bg-card); color: var(--text-main); border-radius: 12px; max-width: 500px; width: 90%; padding: 24px; position: relative;">
    <button onclick="document.getElementById('universal-modal').style.display='none'" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted);">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>
