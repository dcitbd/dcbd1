<!-- Animated Page Loader -->
<div id="global-loader" style="display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 3000; align-items: center; justify-content: center; flex-direction: column;">
  <div style="width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
  <p style="margin-top: 15px; font-weight: 700; color: var(--primary);">লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
</div>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
