<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>প্রোফাইল | Customer Portal - Dream Cart BD</title>
  <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7IMYDMkNYleCqUCLvSDtcioP1MAENEONLcelVu_7byA&s=10">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7IMYDMkNYleCqUCLvSDtcioP1MAENEONLcelVu_7byA&s=10" alt="Logo">
        <div>
          <h4 style="font-size: 15px; font-weight: 800; color: white;">Customer Portal</h4>
          <span style="font-size: 11px; color: #94a3b8;">Dream Cart BD</span>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-link"><i class="fa fa-tachometer-alt"></i> ড্যাশবোর্ড</a>
        <a href="profile.html" class="admin-nav-link active"><i class="fa fa-user-circle"></i> প্রোফাইল</a>
        
        <a href="orders.html" class="admin-nav-link"><i class="fa fa-shopping-bag"></i> অর্ডার সমূহ</a>
        <a href="cart.html" class="admin-nav-link"><i class="fa fa-shopping-cart"></i> আমার কার্ট</a>
        <a href="favourite.html" class="admin-nav-link"><i class="fa fa-heart"></i> পছন্দের তালিকা</a>
        
        <a href="settings.html" class="admin-nav-link"><i class="fa fa-cog"></i> সেটিংস</a>
        <a href="../index.html" class="admin-nav-link"><i class="fa fa-store"></i> মূল ওয়েবসাইট</a>
        <a href="#" class="admin-nav-link logout-btn" style="color: #ef4444;"><i class="fa fa-sign-out-alt"></i> লগআউট</a>
      </nav>
    </aside>

    <!-- Content Area -->
    <div class="admin-content">
      <header class="admin-topbar">
        <div>
          <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main);">প্রোফাইল</h3>
        </div>
        <div class="admin-user-info">
          <button class="theme-toggle-btn" style="margin-right: 12px;"><i class="fas fa-moon"></i></button>
          <img src="https://cdn-icons-png.flaticon.com/512/4042/4042356.png" alt="User">
          <div>
            <div style="font-size: 13px; font-weight: 700; color: var(--text-main);" class="user-display-name">Customer User</div>
            <div style="font-size: 11px; color: var(--text-muted);" class="user-display-mobile">01XXXXXXXXX</div>
          </div>
        </div>
      </header>

      <main class="admin-main">
        
<div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; max-width: 600px;">
  <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">আমার প্রোফাইল তথ্য</h3>
  <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
    <img src="https://cdn-icons-png.flaticon.com/512/4042/4042356.png" alt="Profile" style="width: 80px; height: 80px; border-radius: 50%;">
    <div>
      <h4 class="user-display-name" style="font-size: 18px; font-weight: 800;">Sagor</h4>
      <p style="font-size: 13px; color: var(--text-muted);">কাস্টমার অ্যাকাউন্ট</p>
    </div>
  </div>

  <form id="profile-edit-form">
    <div style="margin-bottom: 14px;">
      <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px;">নাম</label>
      <input type="text" name="name" value="Sagor" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
    </div>
    <div style="margin-bottom: 14px;">
      <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px;">মোবাইল</label>
      <input type="text" name="mobile" value="018789653143" readonly style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-muted);">
    </div>
    <div style="margin-bottom: 14px;">
      <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px;">ইমেইল</label>
      <input type="email" name="mail" value="sagor@gmail.com" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
    </div>
    <div style="margin-bottom: 20px;">
      <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px;">ঠিকানা</label>
      <textarea name="address" rows="2" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">BaraPara, Adarsha Sadar, Cumilla</textarea>
    </div>
    <button type="button" onclick="showToast('প্রোফাইল আপডেট সম্পন্ন হয়েছে!', 'success')" class="btn-order-now" style="width: auto; padding: 10px 24px;">পরিবর্তন সংরক্ষণ করুন</button>
  </form>
</div>

      </main>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/customer.js"></script>
</body>
</html>
