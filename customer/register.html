<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Customer Registration | Dream Cart BD</title>
  <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7IMYDMkNYleCqUCLvSDtcioP1MAENEONLcelVu_7byA&s=10">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px 0;">
  <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 32px; max-width: 480px; width: 90%; box-shadow: var(--card-shadow);">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 20px; font-weight: 800; color: var(--primary);">কাস্টমার রেজিস্ট্রেশন</h2>
      <p style="font-size: 12px; color: var(--text-muted);">Dream Cart BD-এর সদস্য হতে ফর্মটি পূরণ করুন</p>
    </div>

    <form id="customer-register-form">
      <div style="margin-bottom: 14px;">
        <label style="font-size: 12px; font-weight: 700; margin-bottom: 4px; display: block;">পূর্ণ নাম *</label>
        <input type="text" name="name" required placeholder="আপনার নাম" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <div style="margin-bottom: 14px;">
        <label style="font-size: 12px; font-weight: 700; margin-bottom: 4px; display: block;">মোবাইল নম্বর *</label>
        <input type="tel" name="mobile" required placeholder="01XXXXXXXXX" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <div style="margin-bottom: 14px;">
        <label style="font-size: 12px; font-weight: 700; margin-bottom: 4px; display: block;">ইমেইল (ঐচ্ছিক)</label>
        <input type="email" name="mail" placeholder="email@example.com" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <div style="margin-bottom: 14px;">
        <label style="font-size: 12px; font-weight: 700; margin-bottom: 4px; display: block;">ঠিকানা *</label>
        <textarea name="address" required placeholder="জেলা, থানা, এলাকা..." rows="2" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);"></textarea>
      </div>
      <div style="margin-bottom: 20px;">
        <label style="font-size: 12px; font-weight: 700; margin-bottom: 4px; display: block;">পাসওয়ার্ড *</label>
        <input type="password" name="password" required placeholder="******" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <button type="submit" class="btn-order-now" style="width: 100%; padding: 12px; font-size: 14px;">রেজিস্ট্রেশন সম্পন্ন করুন</button>
    </form>

    <div style="text-align: center; margin-top: 16px; font-size: 13px;">
      আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html" style="color: var(--primary); font-weight: 700;">লগইন করুন</a>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('customer-register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('রেজিস্ট্রেশন সফল হয়েছে! এখন লগইন করুন।', 'success');
      setTimeout(() => window.location.href = 'login.html', 1000);
    });
  </script>
</body>
</html>
