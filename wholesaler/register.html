<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Wholesaler Registration | Dream Cart BD</title>
  <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7IMYDMkNYleCqUCLvSDtcioP1MAENEONLcelVu_7byA&s=10">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 32px; max-width: 480px; width: 90%; box-shadow: var(--card-shadow);">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 20px; font-weight: 800; color: #4361ee;">হোলসেলার অ্যাকাউন্ট রেজিস্ট্রেশন</h2>
      <p style="font-size: 12px; color: var(--text-muted);">পাইকারি রেটে ক্রয়ের জন্য আবেদন করুন</p>
    </div>

    <form id="wholesaler-reg-form">
      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; font-weight: 700;">প্রতিষ্ঠানের নাম *</label>
        <input type="text" name="shopName" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; font-weight: 700;">প্রোপ্রাইটরের নাম *</label>
        <input type="text" name="name" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; font-weight: 700;">মোবাইল নম্বর *</label>
        <input type="tel" name="mobile" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <div style="margin-bottom: 20px;">
        <label style="font-size: 12px; font-weight: 700;">পাসওয়ার্ড *</label>
        <input type="password" name="password" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);">
      </div>
      <button type="submit" class="btn-order-now" style="width: 100%; padding: 12px; background: #4361ee;">হোলসেলার হিসেবে রেজিস্ট্রেশন</button>
    </form>
    <div style="text-align: center; margin-top: 14px; font-size: 13px;">
      আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html" style="color: #4361ee; font-weight: 700;">লগইন করুন</a>
    </div>
  </div>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('wholesaler-reg-form').addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('আবেদন গৃহীত হয়েছে!', 'success');
      setTimeout(() => window.location.href = 'login.html', 1000);
    });
  </script>
</body>
</html>
